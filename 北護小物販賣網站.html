function Avatar({name, color, size=40}) {
  return (
    <div style={{width:size,height:size,borderRadius:"50%",background:color||"#0EA5E9",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
      <span style={{color:"#fff",fontSize:size*0.38,fontWeight:700}}>{name?name[0]:"?"}</span>
    </div>
  );
}

function Badge({children, color="#0EA5E9", bg="#e0f2fe"}) {
  return <span style={{display:"inline-block",padding:"2px 10px",borderRadius:99,background:bg,color,fontSize:12,fontWeight:600}}>{children}</span>;
}

function CategoryBadge({cat}) {
  const map = {"書籍":["#1d4ed8","#dbeafe"],"彩妝":["#be185d","#fce7f3"],"衣服":["#7c3aed","#ede9fe"],"生活用品":["#065f46","#d1fae5"]};
  const [c,b] = map[cat]||["#374151","#f3f4f6"];
  return <Badge color={c} bg={b}>{cat}</Badge>;
}

function ProductCard({product, onClick, onFavorite, isFav}) {
  return (
    <div onClick={()=>onClick(product)}
      style={{background:"#fff",borderRadius:16,boxShadow:"0 2px 12px rgba(0,0,0,.07)",overflow:"hidden",cursor:"pointer",transition:"transform .18s,box-shadow .18s"}}
      onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-4px)";e.currentTarget.style.boxShadow="0 8px 28px rgba(0,0,0,.13)"}}
      onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow="0 2px 12px rgba(0,0,0,.07)"}}>
      <div style={{position:"relative",aspectRatio:"4/3",overflow:"hidden",background:"#f1f5f9"}}>
        <img src={product.image} alt={product.title} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
        <button onClick={e=>{e.stopPropagation();onFavorite(product.id)}}
          style={{position:"absolute",top:10,right:10,width:34,height:34,borderRadius:"50%",background:"rgba(255,255,255,.9)",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
          <HeartIcon filled={isFav}/>
        </button>
      </div>
      <div style={{padding:"14px 16px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <CategoryBadge cat={product.category}/>
          <span style={{fontSize:11,color:"#94a3b8",display:"flex",alignItems:"center",gap:3}}><ClockIcon/>{product.date}</span>
        </div>
        <h3 style={{margin:"0 0 6px",fontSize:15,fontWeight:600,color:"#1e293b",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{product.title}</h3>
        <p style={{margin:"0 0 10px",fontSize:13,color:"#64748b",overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{product.description}</p>
        <div style={{fontSize:18,fontWeight:700,color:"#0ea5e9"}}>NT$ {product.price}</div>
      </div>
    </div>
  );
}

function ChatPage() {
  const [chats, setChats] = useState(CHATS_INIT);
  const [selected, setSelected] = useState("1");
  const [msg, setMsg] = useState("");
  const messagesEndRef = useRef(null);
  const currentChat = chats.find(c=>c.id===selected);
  const sendMsg = e => {
    e.preventDefault();
    if(!msg.trim()) return;
    const newMsg = {id:"m"+Date.now(),sender:"me",text:msg,time:new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})};
    setChats(cs=>cs.map(c=>c.id===selected?{...c,messages:[...c.messages,newMsg],lastMessage:msg,unread:0}:c));
    setMsg("");
  };
  useEffect(()=>{messagesEndRef.current&&messagesEndRef.current.scrollIntoView({behavior:"smooth"});},[currentChat&&currentChat.messages&&currentChat.messages.length]);
  return (
    <div style={{maxWidth:1100,margin:"0 auto",padding:"32px 20px"}}>
      <h1 style={{fontSize:26,fontWeight:800,color:"#1e293b",marginBottom:6}}>聊天室</h1>
      <p style={{color:"#64748b",marginBottom:20}}>與賣家私訊聊天</p>
      <div style={{background:"#fff",borderRadius:18,boxShadow:"0 2px 14px rgba(0,0,0,.07)",overflow:"hidden",display:"grid",gridTemplateColumns:"280px 1fr",height:520}}>
        <div style={{borderRight:"1px solid #f1f5f9",display:"flex",flexDirection:"column",overflowY:"auto"}}>
          {chats.map(c=>(
            <button key={c.id} onClick={()=>{setSelected(c.id);setChats(cs=>cs.map(x=>x.id===c.id?{...x,unread:0}:x));}}
              style={{width:"100%",padding:"14px 16px",border:"none",background:selected===c.id?"#f0f9ff":"#fff",cursor:"pointer",textAlign:"left",borderBottom:"1px solid #f8fafc",display:"flex",gap:10,alignItems:"center"}}>
              <Avatar name={c.name} color={c.color} size={42}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                  <span style={{fontWeight:600,fontSize:14,color:"#1e293b"}}>{c.name}</span>
                  <span style={{fontSize:11,color:"#94a3b8"}}>{c.time}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <p style={{fontSize:12,color:"#64748b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:120}}>{c.lastMessage}</p>
                  {c.unread>0&&<span style={{minWidth:18,height:18,background:"#ef4444",color:"#fff",borderRadius:99,fontSize:11,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 5px"}}>{c.unread}</span>}
                </div>
              </div>
            </button>
          ))}
        </div>
        <div style={{display:"flex",flexDirection:"column"}}>
          <div style={{padding:"14px 20px",borderBottom:"1px solid #f1f5f9",display:"flex",alignItems:"center",gap:12}}>
            <Avatar name={currentChat&&currentChat.name} color={currentChat&&currentChat.color} size={38}/>
            <div>
              <div style={{fontWeight:600,color:"#1e293b"}}>{currentChat&&currentChat.name}</div>
              <div style={{fontSize:12,color:"#22c55e"}}>● 線上</div>
            </div>
          </div>
          <div style={{flex:1,overflowY:"auto",padding:"20px",display:"flex",flexDirection:"column",gap:12}}>
            {currentChat&&currentChat.messages.map(m=>(
              <div key={m.id} style={{display:"flex",justifyContent:m.sender==="me"?"flex-end":"flex-start"}}>
                <div style={{maxWidth:"65%"}}>
                  <div style={{padding:"10px 14px",borderRadius:m.sender==="me"?"16px 16px 4px 16px":"16px 16px 16px 4px",background:m.sender==="me"?"linear-gradient(135deg,#0ea5e9,#0284c7)":"#f1f5f9",color:m.sender==="me"?"#fff":"#1e293b",fontSize:14,lineHeight:1.5}}>
                    {m.text}
                  </div>
                  <div style={{fontSize:11,color:"#94a3b8",marginTop:4,textAlign:m.sender==="me"?"right":"left"}}>{m.time}</div>
                </div>
              </div>
            ))}
            <div ref={messagesEndRef}/>
          </div>
          <form onSubmit={sendMsg} style={{padding:"14px 20px",borderTop:"1px solid #f1f5f9",display:"flex",gap:10}}>
            <input value={msg} onChange={e=>setMsg(e.target.value)} placeholder="輸入訊息..."
              style={{flex:1,padding:"11px 14px",border:"1px solid #e2e8f0",borderRadius:10,fontSize:14,outline:"none"}}/>
            <button type="submit" style={{background:"linear-gradient(135deg,#0ea5e9,#0284c7)",color:"#fff",border:"none",padding:"0 20px",borderRadius:10,cursor:"pointer",display:"flex",alignItems:"center",gap:6,fontWeight:600}}>
              <SendIcon/>傳送
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}

function VisualSearchPage({products, favorites, toggleFav, showProduct}) {
  const [uploadedImage, setUploadedImage] = useState(null);
  const [searching, setSearching] = useState(false);
  const [results, setResults] = useState(null);
  const handleImg = e => {
    const f = e.target.files && e.target.files[0];
    if(f) {
      const r = new FileReader();
      r.onloadend = () => { setUploadedImage(r.result); setResults(null); };
      r.readAsDataURL(f);
    }
  };
  const doSearch = () => {
    setSearching(true);
    setTimeout(()=>{ setSearching(false); setResults(products.slice(0,3)); }, 1500);
  };
  return (
    <div style={{maxWidth:900,margin:"0 auto",padding:"32px 20px"}}>
      <div style={{textAlign:"center",marginBottom:32}}>
        <h1 style={{fontSize:26,fontWeight:800,color:"#1e293b",marginBottom:6}}>以圖搜圖</h1>
        <p style={{color:"#64748b"}}>上傳圖片，快速找到相似商品</p>
      </div>
      <div style={{background:"#fff",borderRadius:18,padding:"32px",boxShadow:"0 2px 14px rgba(0,0,0,.07)",marginBottom:28}}>
        {!uploadedImage ? (
          <label style={{display:"block",border:"2px dashed #e2e8f0",borderRadius:14,padding:"48px 32px",textAlign:"center",cursor:"pointer"}}
            onMouseEnter={e=>e.currentTarget.style.borderColor="#0ea5e9"}
            onMouseLeave={e=>e.currentTarget.style.borderColor="#e2e8f0"}>
            <input type="file" accept="image/*" onChange={handleImg} style={{display:"none"}}/>
            <div style={{color:"#94a3b8",width:48,height:48,margin:"0 auto 16px"}}><ImageIcon/></div>
            <p style={{color:"#1e293b",fontWeight:600,fontSize:16,marginBottom:6}}>點擊或拖曳圖片到這裡</p>
            <p style={{color:"#94a3b8",fontSize:13}}>支援 JPG、PNG 格式</p>
          </label>
        ) : (
          <div style={{textAlign:"center"}}>
            <div style={{position:"relative",display:"inline-block",marginBottom:20}}>
              <img src={uploadedImage} alt="uploaded" style={{maxHeight:280,borderRadius:12,objectFit:"cover"}}/>
              <button onClick={()=>{setUploadedImage(null);setResults(null);}}
                style={{position:"absolute",top:8,right:8,width:28,height:28,borderRadius:"50%",background:"#ef4444",border:"none",color:"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
                <XIcon/>
              </button>
            </div>
            <br/>
            <button onClick={doSearch} disabled={searching}
              style={{background:"linear-gradient(135deg,#0ea5e9,#0284c7)",color:"#fff",border:"none",padding:"12px 32px",borderRadius:12,fontWeight:700,cursor:searching?"wait":"pointer",fontSize:15,display:"inline-flex",alignItems:"center",gap:8}}>
              {searching ? "搜尋中..." : "開始搜尋"}
            </button>
          </div>
        )}
      </div>
      {results && (
        <div>
          <h2 style={{fontSize:18,fontWeight:700,color:"#1e293b",marginBottom:16}}>搜尋結果（{results.length} 件相似商品）</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:18}}>
            {results.map(p=><ProductCard key={p.id} product={p} onClick={showProduct} onFavorite={toggleFav} isFav={favorites.has(p.id)}/>)}
          </div>
        </div>
      )}
    </div>
  );
}

                <input required type={f.type} value={form[f.key]} onChange={e=>setForm({...form,[f.key]:e.target.value})}
                  placeholder={"請輸入"+f.label}
                  style={{width:"100%",padding:"10px 14px",border:"1px solid #e2e8f0",borderRadius:10,fontSize:14,outline:"none",boxSizing:"border-box"}}/>
              </div>
            ))}
            {err&&<p style={{color:"#ef4444",fontSize:13,marginBottom:12}}>{err}</p>}
            <label style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:20,cursor:"pointer",fontSize:13,color:"#475569"}}>
              <input type="checkbox" required style={{marginTop:2}}/>
              我同意使用條款與隱私政策，並確認為北護大學在學學生
            </label>
            <button type="submit" style={{width:"100%",background:"linear-gradient(135deg,#0ea5e9,#0284c7)",color:"#fff",border:"none",padding:"13px 0",borderRadius:12,fontWeight:700,fontSize:15,cursor:"pointer",marginBottom:14}}>註冊</button>
            <p style={{textAlign:"center",fontSize:13,color:"#64748b"}}>已有帳號？
              <button type="button" onClick={()=>setPage("login")} style={{border:"none",background:"none",color:"#0ea5e9",cursor:"pointer",fontWeight:600}}>立即登入</button>
            </p>
          </form>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState("home");
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [products] = useState(PRODUCTS);
  const [favorites, setFavorites] = useState(new Set());
  const [selectedProduct, setSelectedProduct] = useState(null);

  const toggleFav = id => setFavorites(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});
  const showProduct = product => {setSelectedProduct(product);setPage("product-detail");};
  const goChat = () => {if(isLoggedIn)setPage("chat");else setPage("login");};
  const noLayout = page==="login"||page==="register";

  const renderPage = () => {
    switch(page) {
      case "home": return <HomePage setPage={setPage} products={products} favorites={favorites} toggleFav={toggleFav} showProduct={showProduct}/>;
      case "products": return <ProductListPage products={products} favorites={favorites} toggleFav={toggleFav} showProduct={showProduct}/>;
      case "jobs": return <JobListPage/>;
      case "courses": return <CourseListPage/>;
      case "create": return <CreatePostPage setPage={setPage} isLoggedIn={isLoggedIn}/>;
      case "chat": return <ChatPage/>;
      case "group-chat": return <GroupChatPage/>;
      case "visual-search": return <VisualSearchPage products={products} favorites={favorites} toggleFav={toggleFav} showProduct={showProduct}/>;
      case "product-detail": return <ProductDetailPage product={selectedProduct} favorites={favorites} toggleFav={toggleFav} setPage={setPage} onContact={goChat}/>;
      case "profile": return <ProfilePage setIsLoggedIn={setIsLoggedIn} setPage={setPage} favorites={favorites} products={products}/>;
      case "login": return <LoginPage setPage={setPage} setIsLoggedIn={setIsLoggedIn}/>;
      case "register": return <RegisterPage setPage={setPage} setIsLoggedIn={setIsLoggedIn}/>;
      default: return <HomePage setPage={setPage} products={products} favorites={favorites} toggleFav={toggleFav} showProduct={showProduct}/>;
    }
  };

  return (
    <div style={{minHeight:"100vh",background:"#f8fafc"}}>
      {!noLayout && <Navbar page={page} setPage={setPage} isLoggedIn={isLoggedIn} setIsLoggedIn={setIsLoggedIn}/>}
      <div>{renderPage()}</div>
      {!noLayout && <Footer setPage={setPage}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
